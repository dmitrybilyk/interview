version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: mongo-practice
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: practicedb
    volumes:
      - mongo-data:/data/db
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  mongo-data:
