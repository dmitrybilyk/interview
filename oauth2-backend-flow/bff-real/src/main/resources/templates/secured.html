<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Secured</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
        h2 { font-size: 1.15rem; }
        .card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; background: #fafafa; }
        .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none;
               padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.95rem; margin: 0.2rem; }
        .btn.danger { background: #dc2626; }
        .btn.secondary { background: #6b7280; }
        pre { background: #0f172a; color: #d1e7ff; padding: 0.75rem; border-radius: 6px;
              font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; overflow-x: auto; }
        code { background: #f1f5f9; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.85rem; }
    </style>
</head>
<body>
<p>✅ <strong th:text="${name}">Alice</strong> &lt;<span th:text="${email}"></span>&gt;</p>

<div class="card">
    <h2>ID Token claims</h2>
    <pre th:text="${claims}"></pre>
</div>

<div class="card">
    <h2>Access Token (у серверній сесії, браузер не бачить)</h2>
    <pre th:text="${accessTokenMasked}"></pre>
    <small style="color:#6b7280">Expires: <span th:text="${accessTokenExpiry}"></span></small>
</div>

<div class="card">
    <h2>Downstream Resource Server</h2>
    <form method="post" action="/call-api">
        <button class="btn" type="submit">BFF → GET /api/protected-data (Bearer token)</button>
    </form>
</div>

<div class="card">
    <form method="post" action="/logout" style="display:inline">
        <button class="btn danger" type="submit">Вийти локально</button>
    </form>
    <a class="btn secondary" href="/keycloak-logout">Вийти з Keycloak SSO</a>
</div>
</body>
</html>
